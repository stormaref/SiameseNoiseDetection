[project]
name = "siamese-noise-detection"
version = "0.2.0"
description = "Instance-Dependent Label Noise Correction via Contrastive Learning and Ensemble Disagreement"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "pillow==12.3.0",
    "tqdm==4.70.0",
    "timm==1.0.28",
]

[project.optional-dependencies]
notebook = [
    "ipykernel",
    "jupyter",
]

[project.scripts]
snd = "snd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snd"]

[tool.uv]
package = true
